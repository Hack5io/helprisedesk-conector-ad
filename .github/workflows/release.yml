name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Tests
        run: go test ./...

      - name: Compilar para Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o conector-ad-windows-amd64.exe ./cmd/conector-ad

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: conector-ad-windows-amd64.exe
          generate_release_notes: true
