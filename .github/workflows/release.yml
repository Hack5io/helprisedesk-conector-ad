name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Para poder publicar la imagen en GitHub Container Registry (ver el
  # job "docker" más abajo) -- se autentica sola con este mismo token,
  # sin ninguna cuenta ni credencial nueva que gestionar.
  packages: write

jobs:
  build-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Tests
        run: go test ./...

      - name: Compilar para Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o conector-ad-windows-amd64.exe ./cmd/conector-ad

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: conector-ad-windows-amd64.exe
          generate_release_notes: true

  # Solo relevante para un cliente que quiera correr el conector en
  # Linux en vez de como Servicio de Windows (ver Dockerfile) -- la
  # instalación normal (install.ps1) no depende de esto para nada.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (minúsculas, GHCR lo exige)
        id: imagen
        run: echo "nombre=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.imagen.outputs.nombre }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # amd64 + arm64 en el mismo build -- un cliente puede querer
      # correrlo en un servidor Linux normal o en algo tipo Raspberry Pi.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
